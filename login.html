<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

<h2>Login</h2>
<input id="username" placeholder="Username">
<div id="recaptcha-container"></div>
<button onclick="sendOTP()">Send OTP</button>

<script>
const firebaseConfig={
apiKey:"AIzaSyADL0vGA5WzGc_hHucC5uhsU9Xpng6zdfs",
authDomain:"loginagroaura.firebaseapp.com",
projectId:"loginagroaura"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

/* IMPORTANT — initialize recaptcha on load */
window.onload=()=>{
window.recaptchaVerifier=new firebase.auth.RecaptchaVerifier(
"recaptcha-container",
{size:"normal"},
auth
);
};

async function sendOTP(){
const snap=await db.collection("users")
.where("username","==",username.value).get();

if(snap.empty){alert("User not found");return;}

const phone=snap.docs[0].data().phone;

const res=await auth.signInWithPhoneNumber(phone,window.recaptchaVerifier);
window.confirmationResult=res;
sessionStorage.setItem("phone",phone);
location.href="verify.html";
}
</script>
</body>
</html>
